<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    body { font-family: Arial, "Noto Sans KR", sans-serif; }
    form {
      width: 100%; padding: 14px; border: 1px solid rgba(220,191,115,.56);
      border-radius: 24px; background: rgba(13,32,27,.96);
      box-shadow: 0 16px 48px rgba(0,0,0,.24), inset 0 1px rgba(255,255,255,.04);
    }
    input {
      width: 100%; height: 126px; border: 1px solid rgba(220,191,115,.36);
      border-radius: 16px; outline: none; padding: 12px 24px 16px;
      background: #0e231d; color: #fff1b8; caret-color: #5be39f;
      font-size: clamp(44px, 7vw, 72px); line-height: 1.05; font-weight: 800;
      text-align: center; letter-spacing: .08em; text-transform: uppercase;
    }
    input:focus {
      border-color: #dcbf73; box-shadow: 0 0 0 4px rgba(220,191,115,.13);
    }
    input::placeholder { color: rgba(220,191,115,.25); }
    .hint {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      color: #a5b6ae; font-size: 14px; font-weight: 700; margin-top: 10px;
      padding: 0 5px;
    }
    .hint strong { color: #f4dfab; }
    @media (max-width: 640px) {
      input { height: 110px; font-size: 56px; }
      .hint { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <form id="quick-form">
    <input id="quick-command" maxlength="14" placeholder="300RT140" autocomplete="off"
           autocapitalize="characters" spellcheck="false" autofocus
           aria-label="사용 칩, 두 글자 ID, 획득 점수 입력">
    <div class="hint"><span><strong>300RT140</strong> → 사용 30,000P · 획득 14,000P · 변동 -16,000P</span><span>입력 후 Enter</span></div>
  </form>
  <script>
    const input = document.getElementById("quick-command");
    const form = document.getElementById("quick-form");

    function send(type, data = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }

    function resize() {
      send("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
    }

    function focusInput() {
      window.requestAnimationFrame(() => {
        input.focus({ preventScroll: true });
        input.select();
      });
    }

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        resize();
        window.setTimeout(focusInput, 20);
      }
    });

    input.addEventListener("input", () => {
      input.value = input.value.toUpperCase().replace(/[^0-9A-Z]/g, "");
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const command = input.value.trim().toUpperCase();
      if (!command) {
        focusInput();
        return;
      }
      send("streamlit:setComponentValue", {
        value: { command, submission_id: `${Date.now()}-${Math.random()}` }
      });
      input.value = "";
      window.setTimeout(focusInput, 20);
    });

    send("streamlit:componentReady", { apiVersion: 1 });
    resize();
    focusInput();
  </script>
</body>
</html>
